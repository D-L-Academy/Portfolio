<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Office Wi-Fi coverage plan preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f27"/><stop offset="1" stop-color="#101216"/></linearGradient>
    <radialGradient id="c1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5cc8ff" stop-opacity="0.7"/><stop offset="0.55" stop-color="#2f7bff" stop-opacity="0.28"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="c2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff9142" stop-opacity="0.55"/><stop offset="0.55" stop-color="#ff6a1a" stop-opacity="0.2"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#2266ff"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- floor plan -->
  <rect x="70" y="80" width="660" height="440" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.22" stroke-width="3"/>
  <g stroke="#fff" stroke-opacity="0.2" stroke-width="3" fill="none">
    <path d="M70 300 H330 M330 80 V300 M330 380 V520 M520 80 V210 M520 290 V520 M520 400 H730 M200 300 V330"/>
  </g>
  <!-- coverage -->
  <circle cx="200" cy="190" r="190" fill="url(#c1)"/>
  <circle cx="440" cy="440" r="210" fill="url(#c1)"/>
  <circle cx="620" cy="200" r="180" fill="url(#c2)"/>
  <g fill="none" stroke="#5cc8ff" stroke-opacity="0.35"><circle cx="200" cy="190" r="70"/><circle cx="200" cy="190" r="120"/><circle cx="440" cy="440" r="70"/><circle cx="440" cy="440" r="120"/></g>
  <g fill="none" stroke="#ff9142" stroke-opacity="0.4"><circle cx="620" cy="200" r="70"/><circle cx="620" cy="200" r="120"/></g>
  <!-- access points -->
  <g>
    <circle cx="200" cy="190" r="20" fill="url(#bl)"/><circle cx="200" cy="190" r="7" fill="#0e1218"/>
    <circle cx="440" cy="440" r="20" fill="url(#bl)"/><circle cx="440" cy="440" r="7" fill="#0e1218"/>
    <circle cx="620" cy="200" r="20" fill="#ff8a3d"/><circle cx="620" cy="200" r="7" fill="#0e1218"/>
  </g>
  <!-- device dots -->
  <g fill="#fff" opacity="0.7"><circle cx="150" cy="130" r="5"/><circle cx="270" cy="240" r="5"/><circle cx="390" cy="480" r="5"/><circle cx="500" cy="380" r="5"/><circle cx="600" cy="120" r="5"/><circle cx="690" cy="250" r="5"/><circle cx="130" cy="240" r="5"/><circle cx="600" cy="460" r="5"/></g>
  <!-- legend -->
  <rect x="70" y="536" width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.1"/>
  <circle cx="92" cy="553" r="6" fill="#5cc8ff"/><rect x="106" y="548" width="60" height="9" rx="4.5" fill="#fff" opacity="0.55"/><circle cx="184" cy="553" r="6" fill="#ff9142"/><rect x="198" y="548" width="50" height="9" rx="4.5" fill="#fff" opacity="0.55"/>
</svg>
